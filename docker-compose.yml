# «Свои вина»: the site (Nuxt SSR + API) and the recognition service (FastAPI, fine-tuned SigLIP2 + RF-DETR on a GPU).
#   docker compose up --build                                          -> http://localhost:3000   (NVIDIA GPU + nvidia-container-toolkit)
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build                    (no GPU: works, ~5-10 s per photo)
# First start downloads the model weights (~5 GB, Hugging Face) into the ml-weights volume; the ML healthcheck waits for it.
services:
  ml:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.ml-gpu }
    environment:
      FOUND_MIN_COS: ${FOUND_MIN_COS:-0.62}        # found / not in the catalog, tuned model (calibrated on 100 real photos)
    volumes:
      - ./web/data:/data:ro                        # the catalog (slugs, colour, sweetness, year for the reader)
      - ml-weights:/srv/ml/weights
      - hf-cache:/srv/hf
    ports: ["8000:8000"]                           # Swagger: http://localhost:8000/docs
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped

  web:
    build: ./web
    environment:
      NUXT_ML_URL: http://ml:8000
      NUXT_ML_TIMEOUT_MS: "15000"
    ports: ["3000:3000"]
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ml-weights:
  hf-cache:
